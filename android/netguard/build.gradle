plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id "com.vanniktech.maven.publish" version "0.33.0"
}

//apply plugin: 'maven-publish'

// Runs git in the repository, or returns null when git or the history isn't there (eg. a source archive)
def git = { String... args ->
    try {
        def process = (["git"] + args.toList()).execute(null, projectDir)
        def output = process.text.trim()
        return process.waitFor() == 0 ? output : null
    } catch (IOException ignored) {
        return null
    }
}

// The version comes from git tags. The release workflow passes the tag (-PVERSION_NAME=X.Y.Z); every other build is
// a snapshot of the next minor version after the highest X.Y.Z tag in its history. See RELEASING.md.
def netguardVersion = providers.gradleProperty("VERSION_NAME").orNull ?: {
    // Highest, not nearest: a patch tagged after a newer release mustn't take the snapshot back to a released version
    def tag = git("tag", "--merged", "HEAD", "--list", "[0-9]*", "--sort=-v:refname")
        ?.readLines()?.find { it ==~ /\d+\.\d+\.\d+/ }
    if (tag == null) {
        // CI must never publish this version: it means the checkout has no tags (eg. a shallow clone)
        if (System.getenv("CI")) {
            throw new GradleException("netguard: no X.Y.Z tag in the git history; fetch the tags (fetch-depth: 0)")
        }
        logger.warn("netguard: no X.Y.Z tag in the git history, building version 0.0.0-SNAPSHOT")
        return "0.0.0-SNAPSHOT"
    }
    def (major, minor) = tag.tokenize(".")*.toInteger()
    return "${major}.${minor + 1}.0-SNAPSHOT"
}()

// The commit a build is made from, published in the POM and reported by the library with its version
def commit = git("rev-parse", "HEAD")
def dirty = git("status", "--porcelain", "--untracked-files=no") ? ".dirty" : ""
def netguardBuildVersion = commit ? "${netguardVersion}+${commit.take(7)}${dirty}" : netguardVersion

tasks.register("printVersion") {
    doLast { println "${netguardVersion} (${netguardBuildVersion})" }
}

mavenPublishing {
    // publishing to Central Portal; releases go live without a manual step in the portal
    publishToMavenCentral(true)

    signAllPublications()

    coordinates("com.duckduckgo.netguard", "netguard-android", netguardVersion)

    pom {
        name = "DDG Netguard"
        description = "DuckDuckGo networking library."
        inceptionYear = "2022"
        url = "https://github.com/duckduckgo/netguard"
        licenses {
            license {
                name = "GNU General Public License v.3"
                url = "https://github.com/duckduckgo/netguard/blob/main/LICENSE"
                distribution = "https://github.com/duckduckgo/netguard/blob/main/LICENSE"
            }
        }
        developers {
            developer {
                id = "duckduckgo"
                name = "DuckDuckGo"
                url = "https://github.com/duckduckgo/"
            }
        }
        scm {
            url = "https://github.com/duckduckgo/netguard"
            connection = "scm:git:git://github.com/duckduckgo/netguard.git"
            developerConnection = "scm:git:ssh://git@github.com:duckduckgo/netguard.git"
            if (commit) {
                tag = commit
            }
        }
    }
}

android {
    namespace "com.duckduckgo.mobile.netguard"
    compileSdk 32
    ndkVersion "21.4.7075529"

    defaultConfig {
        minSdk 23
        targetSdk 32
        versionCode 1
        versionName "1.0.0"
        project.archivesBaseName = "ddg-android-netguard-${netguardVersion}"
        setProperty("archivesBaseName", "${archivesBaseName}")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                targets "netguard", "libwg-go.so"
                cppFlags ''
                arguments '-DANDROID_STL=none'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
//     buildFeatures {
//         prefab true
//         prefabPublishing true
//     }
//     prefab {
//         create("netguard") {
//             headers = "$parent.projectDir/../src/netguard/include"
//         }
//     }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.18.1'
        }
    }
}

